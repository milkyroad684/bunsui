name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build (verify + generate data and dist)
        run: python tools/build.py

      - name: Python engine tests
        run: python tests/test_engine.py

      - name: JS engine tests
        run: node tests/run_tests.js

      - name: Solver QA (全図 solvable を保証)
        run: python tests/test_solver.py

      - name: Fail if build produced uncommitted changes
        run: |
          if ! git diff --quiet; then
            echo "Generated files are out of date. Run 'python tools/build.py' and commit."
            git diff --stat
            exit 1
          fi
